[package]
name = "ctoon-bench-rust"
version = "0.1.0"
edition = "2021"

# toon-rust reserves the "toon-format" crate name on crates.io
# (default-features off: skips its CLI/TUI deps, which pull in a lot we
# don't need for a benchmark). ctoon is fetched the same way every other
# language fetches it here — straight from GitHub, not a local path —
# even though this repo's root is right above us; see this directory's
# CMakeLists.txt comment for why.
[dependencies]
toon-format = { version = "0.5.0", default-features = false }
ctoon = { git = "https://github.com/mohammadraziei/ctoon.git" }
serde_json = "1"

[profile.release]
opt-level = 3
