name: c/cpp package

# Builds libctoon (C) + ctoon.hpp (C++) + the CLI, runs `cmake --install` per
# component and zips each install tree, CMake package files included, once per
# platform:
#   ctoon-c-<version>-<platform>.zip    component `c`  : lib, ctoon.h, CLI, ctoon::ctoon
#   ctoon-cpp-<version>-<platform>.zip  components `c` + `cpp` : the above + ctoon.hpp, ctoon::ctoonpp
# Each zip is then consumed like a user would (find_package(ctoon CONFIG)):
# tests/c/install_check and tests/cpp/install_check.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]
    paths:
      - CMakeLists.txt
      - cmake/**
      - include/**
      - src/*.c
      - src/sources/**
      - src/bindings/cpp/**
      - src/cli/**
      - tests/c/install_check/**
      - tests/cpp/install_check/**
      - .github/workflows/cpp.yml

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,   os: ubuntu-latest }
          - { platform: linux-aarch64,  os: ubuntu-24.04-arm }
          - { platform: macos-x86_64,   os: macos-15-intel }
          - { platform: macos-arm64,    os: macos-latest }
          - { platform: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: ver
        run: |
          part() { sed -n "s/^#define CTOON_VERSION_$1[[:space:]]*\([0-9][0-9]*\).*/\1/p" include/ctoon.h | head -n 1; }
          v="$(part MAJOR).$(part MINOR).$(part PATCH)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "c=ctoon-c-$v-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
          echo "cpp=ctoon-cpp-$v-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -DCTOON_SPEC_PIN=ON -DCMAKE_BUILD_TYPE=Release -DCTOON_BUILD_TESTS=OFF -DCTOON_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: |
          cmake --install build --config Release --component c   --prefix "pkg/${{ steps.ver.outputs.c }}"
          cmake --install build --config Release --component c   --prefix "pkg/${{ steps.ver.outputs.cpp }}"
          cmake --install build --config Release --component cpp --prefix "pkg/${{ steps.ver.outputs.cpp }}"

      - name: Check the installed packages like a user would
        run: |
          cmake -S tests/c/install_check -B consume-c -DCTOON_EXPECT_C_ONLY=ON -DCMAKE_PREFIX_PATH="$PWD/pkg/${{ steps.ver.outputs.c }}"
          cmake --build consume-c --config Release
          ctest --test-dir consume-c -C Release --output-on-failure
          cmake -S tests/cpp/install_check -B consume-cpp -DCMAKE_PREFIX_PATH="$PWD/pkg/${{ steps.ver.outputs.cpp }}"
          cmake --build consume-cpp --config Release
          ctest --test-dir consume-cpp -C Release --output-on-failure

      - name: List packages
        run: find pkg -type f | sort

      - name: Zip
        working-directory: pkg
        run: |
          cmake -E tar cf "../${{ steps.ver.outputs.c }}.zip"   --format=zip "${{ steps.ver.outputs.c }}"
          cmake -E tar cf "../${{ steps.ver.outputs.cpp }}.zip" --format=zip "${{ steps.ver.outputs.cpp }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cpp-lib-${{ matrix.platform }}
          path: |
            ${{ steps.ver.outputs.c }}.zip
            ${{ steps.ver.outputs.cpp }}.zip
          if-no-files-found: error
